<div class="liman-container">
    <h2>⚓ Liman Kaçakçılığı</h2>

    <button onclick="limanTask()">Görev Yap</button>

    <h3>🏆 Sıralama</h3>
    <div id="leaderboard"></div>
</div>

<script>
// Oyuncu veritabanı
let db = JSON.parse(localStorage.getItem("players") || "{}");

// Örnek oyuncular
if (!db["Oyuncu1"]) db["Oyuncu1"] = { sp: 0, money: 0, gold: 0, tasks: 0 };
if (!db["Oyuncu2"]) db["Oyuncu2"] = { sp: 0, money: 0, gold: 0, tasks: 0 };
if (!db["Oyuncu3"]) db["Oyuncu3"] = { sp: 0, money: 0, gold: 0, tasks: 0 };

// Liman görselleri (örn. URL kullan)
const limanFotos = [
    "https://i.imgur.com/N1a0XhT.png", // 1. sıra
    "https://i.imgur.com/vy5QX7B.png", // 2. sıra
    "https://i.imgur.com/2FdRkYQ.png", // 3. sıra
    "https://i.imgur.com/J6t9lF9.png"  // diğer
];

function limanTask() {
    let players = Object.keys(db);
    let randomPlayer = players[Math.floor(Math.random() * players.length)];

    db[randomPlayer].tasks += 1;
    localStorage.setItem("players", JSON.stringify(db));

    updateLeaderboard();
}

function updateLeaderboard() {
    let playersArr = Object.entries(db).map(([username, data]) => {
        return { username, ...data };
    });

    // Görev sayısına göre sıralama
    playersArr.sort((a, b) => b.tasks - a.tasks);

    let leaderboardDiv = document.getElementById("leaderboard");
    leaderboardDiv.innerHTML = "";

    playersArr.forEach((player, index) => {
        let reward = {};
        let photo = "";

        if (index === 0) {
            reward.sp = 5000000;
            reward.money = 1_000_000_000_000;
            reward.gold = 500;
            photo = limanFotos[0];
        } else if (index === 1) {
            reward.sp = 2000000;
            reward.money = 500_000_000;
            reward.gold = 200;
            photo = limanFotos[1];
        } else if (index === 2) {
            reward.sp = 1000000;
            reward.money = 200_000_000;
            reward.gold = 100;
            photo = limanFotos[2];
        } else {
            reward.sp = 50000;
            reward.money = 1_000_000;
            reward.gold = 10;
            photo = limanFotos[3];
        }

        // Ödülleri kaydet
        db[player.username].sp = reward.sp;
        db[player.username].money = reward.money;
        db[player.username].gold = reward.gold;

        leaderboardDiv.innerHTML += `
            <div class="player-card">
                <img src="${photo}" alt="Liman Görevi">
                <p>${index+1}. ${player.username} | Görev: ${player.tasks} | SP: ${reward.sp.toLocaleString()} | Para: ${reward.money.toLocaleString()} | Altın: ${reward.gold}</p>
            </div>
        `;
    });

    localStorage.setItem("players", JSON.stringify(db));
}

updateLeaderboard();
</script>

<style>
.liman-container {
    background: linear-gradient(to bottom, #1b1b1b, #111);
    color: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    font-family: Arial, sans-serif;
}

button {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: gold;
    color: #111;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 15px;
}

button:hover {
    transform: scale(1.05);
}

.player-card {
    display: flex;
    align-items: center;
    background: #222;
    border-radius: 12px;
    padding: 10px;
    margin: 8px auto;
    max-width: 600px;
    box-shadow: 0 0 10px gold;
}

.player-card img {
    width: 60px;
    height: 60px;
    border-radius: 8px;
    margin-right: 15px;
}
</style>
